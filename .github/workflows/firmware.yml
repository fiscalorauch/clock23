# Tests every push. Pushing a tag like v1.3.0 also builds a release, which is
# what the clock's Update button installs.
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  CORE: esp32:esp32@3.3.11
  FQBN: esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs
  GFX: GFX Library for Arduino@1.6.7
  GC9B72_COMMIT: e8ad9e65b921c70c95a6b2393deb5b58f0b8865c

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run the simulator
        run: tools/sim/run.sh

      - name: Tag must match the firmware version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          grep -q "FIRMWARE_VERSION \"${GITHUB_REF_NAME#v}\"" HaloClock/HaloClock.ino

      - uses: arduino/setup-arduino-cli@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
          key: arduino-${{ env.CORE }}

      - name: Install the core and libraries
        run: |
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install "$CORE" --additional-urls "$URL"
          arduino-cli lib install "$GFX"
          LIBS="$(arduino-cli config get directories.user)/libraries"
          git clone https://github.com/MaliosDark/Arduino_GC9B72 "$LIBS/Arduino_GC9B72"
          git -C "$LIBS/Arduino_GC9B72" checkout "$GC9B72_COMMIT"

      - name: Compile
        run: arduino-cli compile --fqbn "$FQBN" --output-dir build HaloClock

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/HaloClock.ino.bin halo-firmware.bin
          gh release create "$GITHUB_REF_NAME" halo-firmware.bin --generate-notes
